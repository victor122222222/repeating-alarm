plugins {
    id 'com.android.application'
}

android {
    namespace 'app.compas.alarmas'
    compileSdk 34

    defaultConfig {
        applicationId 'app.compas.alarmas'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        compas {
            def ruta = System.getenv('KEYSTORE_PATH')
            if (ruta) {
                storeFile file(ruta)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('KEYSTORE_PATH')) {
                signingConfig signingConfigs.compas
            }
        }
        release {
            minifyEnabled false
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
