name: Compilar APK

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Instalar las dependencias de la web
        run: pnpm install --frozen-lockfile
      - name: Compilar la web para la app
        run: pnpm exec vite build --config vite.android.config.ts
      - name: Comprobar que la web está dentro de la app
        run: |
          test -s android/app/src/main/assets/web/index.html
          ls -R android/app/src/main/assets/web

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar la app
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Preparar la llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/compas.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/compas.jks" >> "$GITHUB_ENV"

      - name: Compilar la app
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon
      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: compas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
