<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compás · Alarmas por turnos</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Si la web falla al arrancar, se muestra el motivo en vez de dejar la pantalla vacía.
      window.addEventListener('error', function (e) {
        var el = document.getElementById('cargando')
        if (el) el.textContent = 'No se pudo iniciar Compás: ' + e.message
      })
    </script>
  </head>
  <body>
    <div id="root">
      <p id="cargando" style="padding: 24px; font: 15px/1.5 sans-serif">
        Cargando Compás…
      </p>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
